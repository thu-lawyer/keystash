[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keystash"
version = "0.4.0"
description = "Local secret broker for AI agents: values live in the macOS Keychain, only metadata stays on disk, and no tool ever returns a secret."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "thu-lawyer" }]
keywords = [
  "password",
  "password-manager",
  "api-key",
  "secrets",
  "keychain",
  "mcp",
  "ai-agent",
  "cli",
  "token",
  "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "cryptography>=41.0",
]

[project.urls]
Homepage = "https://github.com/thu-lawyer/keystash"
Repository = "https://github.com/thu-lawyer/keystash"
Issues = "https://github.com/thu-lawyer/keystash/issues"
Changelog = "https://github.com/thu-lawyer/keystash/releases"

[project.scripts]
keystash = "keystash.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/keystash"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Keep Optional[...]/List[...] annotations: typer evaluates them at runtime,
# where `X | None` would fail on Python 3.9 — so the UP rules must stay off.
select = ["E4", "E7", "E9", "F", "I", "B", "DTZ"]
ignore = [
  "B008",   # typer's Option()/Argument() in defaults is the framework idiom
  "DTZ011", # local-date semantics are intentional for expiry display
]
