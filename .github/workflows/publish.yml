name: Publish to PyPI

# Publishes with PyPI Trusted Publishing (OIDC) — no API token stored.
# One-time setup on pypi.org: Account settings → Publishing → add a
# "pending publisher" with:
#   owner: thu-lawyer, repository: keystash, workflow: publish.yml,
#   environment: pypi
# Then run this workflow from the Actions tab (or publish a GitHub release).

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
